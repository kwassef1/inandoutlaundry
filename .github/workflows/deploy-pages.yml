name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install & build client
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Verify Cloudflare API token and account
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Do a token verification call without printing the token.
          status=$(curl -s -o /tmp/cf_verify.json -w "%{http_code}" \
            -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/tokens/verify" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")
          if [ "$status" -ne 200 ]; then
            echo "Cloudflare token verification failed (HTTP $status). Response:"
            cat /tmp/cf_verify.json
            echo "\nPossible causes: the token is invalid, expired, created for a different account, or lacks Pages permissions."
            exit 1
          fi
          echo "Cloudflare token verified successfully."

      - name: List Cloudflare Pages projects for account
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Listing Pages projects for account ${CF_ACCOUNT_ID}"
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" > /tmp/cf_pages_projects.json
          cat /tmp/cf_pages_projects.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: inandoutlaundry
          directory: './client/build'
